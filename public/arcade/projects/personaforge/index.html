<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PersonaForge</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/explain.css"><link rel="stylesheet" href="css/chat.css">
</head>
<body class="mode-present">
<div id="app">
  <div id="shake"><div id="vp"><div id="world"></div></div></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div><div id="vig" aria-hidden="true"></div>
  <div id="sceneui"><div class="slab" id="slab"><div class="kick" id="s-num"></div><h1 id="s-head"></h1><p id="s-cap"></p><span class="tag" id="s-take"></span></div></div>
  <div id="hud" hidden></div>
  <div id="badge"></div>
  <div id="chrome">
    <a id="arcade" class="kcap wide" href="../../index.html?from=personaforge" aria-label="Back to the arcade"></a>
    <div id="modes" role="group" aria-label="Mode"><button id="mt-p" aria-pressed="true"></button><button id="mt-e" aria-pressed="false"></button></div>
    <div id="keys"><button id="b-r" class="kcap" aria-label="Reality check (R)">R</button><button id="b-t" class="kcap" aria-label="Presenter notes (T)">T</button><button id="b-m" class="kcap" aria-label="Sound (M)" aria-pressed="false">M</button><button id="b-f" class="kcap" aria-label="Fullscreen (F)">F</button></div>
  </div>
  <div id="dots"></div>
  <div id="hint"></div>
  <div id="notes-p" hidden><b>T</b><p id="notes-t"></p></div>
  <div id="reality" hidden><div class="shut"></div><div class="sign"><button id="rc-close" class="kcap" aria-label="Close reality check">Esc</button><div id="rc-in"></div></div></div>
  <div id="entry" hidden></div>
  <div id="tip" role="tooltip" hidden></div>
</div>
<script src="data/facts.js"></script>
<script src="js/sim/flow.js"></script>
<script src="js/sim/compiler.js"></script>
<script src="js/sim/keypool.js"></script>
<script src="js/sim/fx.js"></script>
<script src="js/main.js"></script>
<script src="js/scenes/stage.js"></script>
<script src="js/scenes/scenes.js"></script>
<script src="js/scenes/explore.js"></script>
<script src="data/explain.js"></script>
<script src="../../data/links.js"></script>
<script src="js/explain.js"></script>
<script src="data/chat.js" defer></script>
<script src="js/chat.js" defer></script>
</body>
</html>
